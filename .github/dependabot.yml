# Dependency updates for a DSH bundle.
#
# The @deepseek-ai/* devDependencies are prereleases that move fast — 0.1.7-rc.2
# became 0.2.0-rc.1 — and moving them is the single most likely thing to break
# this package. Bumping one to a version whose contract moved is a real task
# (run the gate: `pnpm run release:gate`, and read what the harness-surface
# check inside `scripts/check.ts` says), so these are opened as pull requests
# rather than merged automatically. An unattended bump that silently breaks the
# seam is worse than a bump that waits.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, dsh-runtime]
    commit-message:
      prefix: "deps"
    ignore:
      # React is never shipped from here: the browser half leaves `react` and
      # `react/jsx-runtime` to the host's module loader (`deps.neverBundle`),
      # and the host is React 18 — `dsh-web-frontend` declares `^18.2.0` and
      # `@types/react ~18.3.1`. A devDependency on 19 would run the suite
      # against a React line the harness does not have: green tests answering
      # a question the runtime never asks. Move both together, on the day the
      # host does.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      # The Voidzero toolchain moves as one lever, by hand. `vite-plus`
      # bundles its own Vitest at an exact version, so the two below are not
      # independent choices: a pull request moving `vitest` alone leaves the
      # suite importing a different Vitest than the one running it, and
      # `@vitest/coverage-v8` has to match `vitest` exactly or
      # `vp test --coverage` stops resolving a provider. A `vite-plus` bump by
      # pull request is red on arrival for a second reason — pnpm rejects any
      # version published inside the last 24h, so the new exact version has to
      # be listed under `minimumReleaseAgeExclude` in pnpm-workspace.yaml
      # before an install can succeed, and whether a bump deserves that
      # exemption is a judgement no bot can make.
      #
      # So: add `vite-plus`, `vitest` and `@vitest/coverage-v8` at one version
      # together, commit the lockfile with them, and run `release:gate`. The
      # tooling group below still covers ultracite, oxlint, oxfmt, typescript
      # and @types/node, none of which vite-plus bundles.
      - dependency-name: "vite-plus"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    groups:
      # One PR for the whole harness set. They are released together, so
      # bumping one without the others produces a lockfile that resolves a
      # mixture of two runtimes.
      dsh-runtime:
        patterns:
          - "@deepseek-ai/*"
      tooling:
        patterns:
          - "ultracite"
          - "oxlint*"
          - "oxfmt"
          - "typescript"
          - "@types/node"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
