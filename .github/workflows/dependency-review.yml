name: dependency-review

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # A dependency change is the one change whose blast radius is invisible in
    # the diff: a patch bump can pull in a compromised transitive package, and
    # nothing in the source diff says so. This comments on the PR when a
    # dependency introduces a known vulnerability or an incompatible license,
    # before it merges rather than after it ships.
    #
    # Non-blocking until the repository enables Dependency graph
    # (Settings → Security → Dependency graph). Without it the action fails
    # with "not supported on this repository" on every PR — noise about a
    # setting, not about the code. Once enabled, findings still report; only
    # the hard failure waits for the feature to exist.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
