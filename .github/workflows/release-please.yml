name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Reads conventional commits (feat:, fix:, …) since the last tag, then
      # opens a version-bump pull request. Merging that PR creates the tag and
      # the GitHub Release, which fires `release.yml`.
      #
      # The settings that matter here live in `release-please-config.json`
      # rather than in the inputs below, because none of them is an action
      # input:
      #
      # - `bump-minor-pre-major` keeps a breaking change on the minor line while
      #   the version is below 1.0.0. Without it a `feat!` proposes 1.0.0, and
      #   this plugin has no business reaching 1.0.0 before the harness it plugs
      #   into leaves 0.x.
      # - `include-component-in-tag: false` keeps tags as `v0.9.0`. The default
      #   prefixes the component (`dsh-tinyfish-v0.9.0`), which matches no
      #   `v*.*.*` filter and so would never fire the publish workflow.
      # - The changelog is release-please's to write: it prepends a versioned
      #   section per release. The unversioned list already in CHANGELOG.md
      #   summarises the state at 0.8.0 and stays below those sections.
      #
      # `manifest-file` is what puts the action in manifest mode, which is the
      # mode `config-file` requires. It carries one line per package path and is
      # kept in step with the released version by release-please itself.
      #
      # The PAT is not optional. Tags and releases created with the built-in
      # GITHUB_TOKEN do not trigger downstream workflows, so a release-please
      # running on the default token would produce a tag that never publishes.
      # Secret: RELEASE_PLEASE_TOKEN — a fine-grained PAT with Contents and
      # Pull requests read/write on this repository only.
      #
      # Until that secret is set this job fails on every push with "Input
      # required and not supplied: token". That is the upstream action's message
      # and it is not improved here: guarding the step on `secrets` in an `if`
      # made GitHub reject the whole file as invalid, which is a worse failure
      # than a clear one. The one-time setup is in CONTRIBUTING.md.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
