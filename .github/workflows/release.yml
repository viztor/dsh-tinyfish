name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins 12.6.0
      # exactly. One source of truth, and the action reads it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec vp check
      - run: pnpm exec vp test --coverage
      - run: node scripts/check.ts

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing needs this and nothing else: no token is stored
      # in the repository, and provenance is automatic.
      id-token: write
      # The GitHub Packages mirror below publishes with GITHUB_TOKEN, which
      # needs packages write. It cannot use OIDC: GitHub Packages has no
      # trusted-publisher concept, so the token is the only route.
      packages: write
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins 12.6.0
      # exactly. One source of truth, and the action reads it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest publishes a version nobody can
      # match to a commit, so this is checked before anything is built.
      - name: The tag matches the manifest version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::${{ github.ref_name }} does not match package.json $expected"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Trusted publishing: the registry verifies this workflow's OIDC identity,
      # so no secret exists to leak or expire. To set it up, add
      # viztor/dsh-tinyfish + `release.yml` to the package's Trusted Publisher
      # settings on npmjs.com and allow the `npm publish` action.
      #
      # The `npm view` guard is the only place idempotency belongs: npm refuses
      # to republish a version, so a retried tag has to skip rather than fail.
      # The publish itself is NOT guarded — a swallowed error here once produced
      # a green release for a version that never reached the registry.
      - name: Publish to npmjs (OIDC, provenance)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-tinyfish@$version" version 2>/dev/null; then
            echo "$version is already on npmjs, skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      # The same content under the organisation scope. `dsh-tinyfish` is the
      # name DSH resolves and the docs use; `@viztor/dsh-tinyfish` is for
      # consumers who install by scope. Published in the same job, from the
      # same tree, so the two can never diverge — and with `--ignore-scripts`,
      # because the step above already ran the full gate.
      #
      # Needs its own Trusted Publisher entry on npmjs.com: a scoped package is
      # a separate package as far as the registry is concerned, so add
      # `@viztor/dsh-tinyfish` with this same workflow file and action.
      #
      # Allowed to fail so the mirror below still runs; the verification step at
      # the end turns any gap into a failed release that names the target.
      - name: Publish the scoped alias (OIDC, provenance)
        continue-on-error: true
        run: node scripts/publish-scoped.ts

      # Mirror the scoped name to GitHub Packages, so the repository sidebar
      # populates and there is a second source if npmjs.org is unreachable.
      # Only the scoped name mirrors: GitHub links packages to repositories by
      # owner scope, so `@viztor/dsh-tinyfish` attaches to this repo while an
      # unscoped push has nowhere to land and fails. One mirrored name is
      # enough for both purposes; npmjs.org remains the canonical source for
      # both names, and nothing here changes resolution.
      #
      # Auth rides on the command line: file appends proved unreliable across
      # setup-node's temp userconfig, and the inline form is what dsh-opencode
      # settled on after three attempts.
      - name: Mirror the scoped name to GitHub Packages
        run: |
          export NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY=https://npm.pkg.github.com node scripts/publish-scoped.ts

      # The release claim, checked instead of assumed. Both names are advertised
      # as equivalent in README.md, so a mirror that silently lags the canonical
      # package is a broken promise the run has to surface.
      #
      # It polls, because a successful `npm publish` does not mean the version
      # is readable yet: npm answers "Your package is being processed and may
      # take a few minutes to become available", and an immediate `npm view`
      # returns nothing. Checking once reported a healthy release as failed.
      - name: Verify every published target
        run: |
          version=$(node -p "require('./package.json').version")
          pending="dsh-tinyfish@$version @viztor/dsh-tinyfish@$version"

          for attempt in $(seq 1 12); do
            still=""
            for spec in $pending; do
              if npm view "$spec" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "ok      $spec  (npmjs.org)"
              else
                still="$still $spec"
              fi
            done
            pending=$(echo "$still" | xargs)
            if [ -z "$pending" ]; then
              echo "every published target is live on npmjs.org"
              exit 0
            fi
            echo "attempt $attempt/12: waiting for npm to index:$pending"
            sleep 15
          done

          echo "::error::these targets did not publish:$pending — register a Trusted Publisher for each at https://www.npmjs.com/package/<name>/access (repository viztor/dsh-tinyfish, workflow release.yml)"
          exit 1
