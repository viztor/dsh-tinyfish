name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins pnpm
      # exactly. One source of truth, and the action reads it — so the version
      # itself is deliberately not repeated here, where it would only rot.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The real compiler over `src/`, `test/` and `scripts/`. `vp check`
      # below type-checks too, through Oxlint's type checker, which only
      # applies the tsconfig to files its `include` covers — `tsconfig.json`
      # covers all three, so the two agree, and this is the step that says so.
      - run: pnpm run typecheck
      - run: pnpm exec vp check
      - run: pnpm exec vp test --coverage
      - run: node scripts/check.ts
      # The real APIs. Non-blocking here too, which is a change of mind from the
      # version that put it in `verify` on the reasoning that publishing a
      # provider that cannot reach its API is the worst outcome. That reasoning
      # was right about the failure and wrong about who should pay for it: a red
      # here is at least as often TinyFish or Monid being unavailable or
      # rate-limiting, and a release that cannot be cut because someone else's
      # API had a bad afternoon gets worked around — which is how the gate ends
      # up disabled, and then it is worse than never having had it.
      #
      # So it reports and never blocks. The information is not lost: a red on
      # this step is visible on the run, and a release cut while it was red is a
      # decision somebody makes on purpose rather than one the pipeline made for
      # them.
      #
      # Note what this does *not* do: it does not convert a live failure into a
      # skip inside the suite. That would hide the defect class that most needs
      # this suite — a transport or decode fault that no stub can see. The
      # `null`-field bug that made `web_fetch` throw `WEB_PROVIDER_ERROR` on
      # ordinary pages arrived as a failed request, and a test that skipped on
      # failed requests would have reported it green. Advisory about the
      # pipeline, strict about the assertions.
      #
      # Skips, rather than runs, when the secrets are absent — the flag resolves
      # to `0` — so a fork or an unconfigured repository still releases.
      - name: Live suite against both real APIs (advisory)
        continue-on-error: true
        env:
          DSH_TINYFISH_LIVE: ${{ secrets.TINYFISH_API_KEY != '' && secrets.MONID_API_KEY != '' && '1' || '0' }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        run: pnpm exec vp test --config vite.live.config.ts --run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing needs this and nothing else: no token is stored
      # in the repository, and provenance is automatic.
      id-token: write
      # The GitHub Packages mirror below publishes with GITHUB_TOKEN, which
      # needs packages write. It cannot use OIDC: GitHub Packages has no
      # trusted-publisher concept, so the token is the only route.
      packages: write
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins pnpm
      # exactly. One source of truth, and the action reads it — so the version
      # itself is deliberately not repeated here, where it would only rot.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest publishes a version nobody can
      # match to a commit, so this is checked before anything is built.
      # The ref arrives through the environment rather than being interpolated
      # into the script text: a tag name may contain `;`, `"`, `$` or a
      # backtick, and this job holds `id-token: write` and a packages token.
      - name: The tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::$TAG does not match package.json $expected"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Trusted publishing: the registry verifies this workflow's OIDC identity,
      # so no secret exists to leak or expire. To set it up, add
      # viztor/dsh-tinyfish + `release.yml` to the package's Trusted Publisher
      # settings on npmjs.com and allow the `npm publish` action.
      #
      # The `npm view` guard is the only place idempotency belongs: npm refuses
      # to republish a version, so a retried tag has to skip rather than fail.
      # The publish itself is NOT guarded — a swallowed error here once produced
      # a green release for a version that never reached the registry.
      - name: Publish to npmjs (OIDC, provenance)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-tinyfish@$version" version 2>/dev/null; then
            echo "$version is already on npmjs, skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      # The same content under the organisation scope. `dsh-tinyfish` is the
      # name DSH resolves and the docs use; `@viztor/dsh-tinyfish` is for
      # consumers who install by scope. Published in the same job, from the
      # same tree, so the two can never diverge — and with `--ignore-scripts`,
      # because the step above already ran the full gate.
      #
      # Needs its own Trusted Publisher entry on npmjs.com: a scoped package is
      # a separate package as far as the registry is concerned, so add
      # `@viztor/dsh-tinyfish` with this same workflow file and action.
      #
      # Allowed to fail so the mirror below still runs; the verification step at
      # the end turns any gap into a failed release that names the target.
      - name: Publish the scoped alias (OIDC, provenance)
        continue-on-error: true
        run: node scripts/publish-scoped.ts

      # Mirror the scoped name to GitHub Packages, so the repository sidebar
      # populates and there is a second source if npmjs.org is unreachable.
      # Only the scoped name mirrors: GitHub links packages to repositories by
      # owner scope, so `@viztor/dsh-tinyfish` attaches to this repo while an
      # unscoped push has nowhere to land and fails. One mirrored name is
      # enough for both purposes; npmjs.org remains the canonical source for
      # both names, and nothing here changes resolution.
      #
      # Auth rides on the command line: file appends proved unreliable across
      # setup-node's temp userconfig, and the inline form is what dsh-opencode
      # settled on after three attempts.
      - name: Mirror the scoped name to GitHub Packages
        run: |
          export NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REGISTRY=https://npm.pkg.github.com node scripts/publish-scoped.ts

      # The release claim, checked instead of assumed. Both names are advertised
      # as equivalent in README.md, and the scoped name is separately promised
      # as a GitHub Packages fallback, so any target that silently lags is a
      # broken promise the run has to surface.
      #
      # It polls, because a successful `npm publish` does not mean the version
      # is readable yet: npm answers "Your package is being processed and may
      # take a few minutes to become available", and an immediate `npm view`
      # returns nothing. Checking once reported a healthy release as failed.
      #
      # The budget is ten minutes, and the canonical name is what needs it. The
      # npmjs targets do not become readable in parallel — for v0.11.3,
      # `dsh-tinyfish` published first and took 4m18s to appear, while the
      # scoped alias, published ten seconds later, took 2m13s. The old budget,
      # twelve attempts at 15s, gave up at 3m06s and failed a release that had
      # in fact succeeded a minute earlier.
      #
      # Three targets, two registries, one loop. The mirror indexes on its own
      # schedule, so checking it after the npmjs wait would serialize two
      # ten-minute budgets for no reason. It also carries a token while the
      # others do not: GitHub Packages authenticates even for a public package,
      # and answers an unauthenticated request with a 404 that does not
      # distinguish "absent" from "not allowed to look". The token rides the
      # command line on the same line as the registry, matching the mirror
      # publish step — and so that the gate can assert the two travel together,
      # which is the difference between a check and a ten-minute false red.
      #
      # The two failures are reported apart because they mean different things.
      # An npmjs target missing is a release that did not land. A missing mirror
      # is a release that landed without its fallback — and it cannot be a
      # publish failure reaching this point, since the mirror step is not
      # continue-on-error: if its publish had failed, the job would have stopped
      # there. So the mirror message names the repair instead of a credential.
      - name: Verify every published target
        run: |
          version=$(node -p "require('./package.json').version")
          npmjs="dsh-tinyfish@$version @viztor/dsh-tinyfish@$version"
          mirror="@viztor/dsh-tinyfish@$version"
          attempts=41
          interval=15

          for attempt in $(seq 1 $attempts); do
            pendingNpmjs=""
            for spec in $npmjs; do
              if npm view "$spec" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "ok      $spec  (npmjs.org)  attempt $attempt/$attempts"
              else
                pendingNpmjs="$pendingNpmjs $spec"
              fi
            done

            if npm view "$mirror" version --registry=https://npm.pkg.github.com "--//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >/dev/null 2>&1; then
              mirrorPending=""
              echo "ok      $mirror  (npm.pkg.github.com)  attempt $attempt/$attempts"
            else
              mirrorPending="$mirror"
            fi

            if [ -z "$pendingNpmjs$mirrorPending" ]; then
              echo "every published target is live"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "attempt $attempt/$attempts: waiting for npm to index:$pendingNpmjs$mirrorPending"
              sleep $interval
            fi
          done

          if [ -n "$pendingNpmjs" ]; then
            echo "::error::the release is incomplete: still unreadable on npmjs.org after $((attempts * interval - interval))s:$pendingNpmjs"
            echo "::error::Read the two publish steps above before touching any credential: both green with a target missing here means npm is still processing that name. Re-check with: npm view <name>@$version version"
            echo "::error::The scoped alias step is continue-on-error, so if that one is the red one, its log names the real cause — a scoped package is a separate registry entry and needs its own Trusted Publisher."
          fi
          if [ -n "$mirrorPending" ] && [ -z "$pendingNpmjs" ]; then
            echo "::error::the npmjs release shipped; the GitHub Packages mirror did not — $mirrorPending is still unreadable after $((attempts * interval - interval))s"
            echo "::error::Re-run this job to repair it: publish-scoped.ts checks the target registry first, so npmjs is skipped and only the mirror is retried."
          elif [ -n "$mirrorPending" ]; then
            # Both are missing, so the mirror is not the story and saying
            # "the npmjs release shipped" here would be false. The block above
            # already named the release as incomplete, which is the actionable
            # fact; the mirror reports itself once npmjs lands and this is
            # re-run.
            echo "::error::the GitHub Packages mirror is missing too, but so is the release itself — repair npmjs first, then re-run this job for the mirror."
          fi
          exit 1
