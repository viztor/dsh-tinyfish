  <text x="460" y="320" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-2">dsh-tinyfish</text>
  <text x="462" y="378" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="400" fill="#C9D8FF">Free web search and fetch — $0 per call</text>
