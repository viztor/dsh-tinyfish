# Bundle patch for `dsh-tinyfish`.
#
# Two jobs: insert the plugin's own row, and point the web seam at it.
#
# The selection override below matches the web row by `id` alone, with no
# `name`. That is deliberate. In the patch format a `name` field *asserts* the
# target's existing plugin name — it does not rename anything — so writing the
# official web package's scoped name in a third-party bundle claims that
# identity, which is what a patch-safety check reads as impersonation. `name`
# is optional, and a config override needs nothing but the id.
#
# A host that wants a different arrangement overrides this in its own patch
# layer, which applies later and therefore wins:
#
#   - id: web
#     config:
#       searchProvider: deepseek-official
#       fetchProvider: http
#
# The two kinds are independent fields, so search can run through TinyFish
# while fetch stays on the shipped http provider, or the other way round.
#
# A host that prefers the Monid envelope — which reuses the credential a Monid
# MCP mount already holds, and costs the same — pins the channel in that same
# layer, where the preference can change without a new release:
#
#   - id: dsh-tinyfish
#     config:
#       channel: monid
#
# `channel` is deliberately NOT set below, so the schema default stands:
# `direct`, which calls TinyFish's own API with the key the `tinyfish` CLI
# stored in ~/.tinyfish/config.json. A package named for TinyFish should not
# open by asking for an account at a different service.
#
# `apiKey` is not set here either — a secret belongs in the environment, the
# CLI's own store, or the harness credentials service, never in a patch file.
- insert:
    - id: dsh-tinyfish
      name: "dsh-tinyfish"
      config:
        attempts: 3
# Found by id; no `name`, so nothing here asserts another package's identity.
# `config` replaces the target's wholesale rather than merging, and the web
# seam's config is exactly these two fields, so nothing is lost.
- id: web
  config:
    searchProvider: tinyfish
    fetchProvider: tinyfish
