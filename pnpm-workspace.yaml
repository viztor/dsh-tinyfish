overrides:
  vite@*: "catalog:"
  # Advisory floors for transitive copies the @deepseek-ai host packages carry:
  # zod memory exhaustion (fix >= 4.6.6); source-map-js event-loop DoS.
  zod: ">=4.6.6"
  source-map-js: ">=1.2.2"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
